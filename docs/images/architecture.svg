<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="540" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(40, 36)">
    <!-- Small Logo Icon -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="8" y="10" width="20" height="16" rx="3" fill="#38bdf8"/>
    <path d="M11 16h14v4H11z" fill="#0f172a"/>
    <circle cx="18" cy="18" r="1.5" fill="#38bdf8"/>

    <text x="48" y="22" class="title">MOSS Lab Architecture</text>
    <text x="48" y="38" class="subtitle">Autonomous Liquid-handling Agent &amp; Physical Simulation Pipeline</text>
  </g>

  <!-- LAYER 1: Interaction & Integration (Top) -->
  <g transform="translate(40, 95)">
    <rect width="840" height="88" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="layer-title" fill="#38bdf8">1. Interaction &amp; External Integration Layer</text>

    <!-- Card 1.1 -->
    <g transform="translate(16, 32)" filter="url(#shadow)">
      <rect width="258" height="44" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="22" r="7" fill="#38bdf8" fill-opacity="0.2"/>
      <circle cx="20" cy="22" r="3.5" fill="#38bdf8"/>
      <text x="36" y="20" class="card-title">Web Interactive Workspace</text>
      <text x="36" y="33" class="card-desc">DeepSeek Harness Web UI · Real-time Session</text>
    </g>

    <!-- Card 1.2 -->
    <g transform="translate(290, 32)" filter="url(#shadow)">
      <rect width="258" height="44" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="22" r="7" fill="#818cf8" fill-opacity="0.2"/>
      <circle cx="20" cy="22" r="3.5" fill="#818cf8"/>
      <text x="36" y="20" class="card-title">Xiaozhi AI Hardware (MCP)</text>
      <text x="36" y="33" class="card-desc">Outbound WSS Bridge · Async Task Delegation</text>
    </g>

    <!-- Card 1.3 -->
    <g transform="translate(564, 32)" filter="url(#shadow)">
      <rect width="260" height="44" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="22" r="7" fill="#34d399" fill-opacity="0.2"/>
      <circle cx="20" cy="22" r="3.5" fill="#34d399"/>
      <text x="36" y="20" class="card-title">Robot Telemetry Probe</text>
      <text x="36" y="33" class="card-desc">Read-only GET /health &amp; /instruments</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <path d="M 185 183 L 185 205 M 460 183 L 460 205 M 735 183 L 735 205" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- LAYER 2: Agent Orchestration & Modes -->
  <g transform="translate(40, 205)">
    <rect width="840" height="88" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="layer-title" fill="#a855f7">2. Core Harness &amp; Dual Agent Engine</text>

    <!-- Card 2.1 -->
    <g transform="translate(16, 32)" filter="url(#shadow)">
      <rect width="398" height="44" rx="8" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.2"/>
      <rect x="12" y="12" width="20" height="20" rx="4" fill="#a855f7" fill-opacity="0.2"/>
      <text x="18" y="26" font-family="monospace" font-size="12" fill="#c084fc">▶</text>
      <text x="42" y="20" class="card-title">Agent Mode (Executable Action)</text>
      <text x="42" y="33" class="card-desc">Protocol Authoring · Tool Calling · analyze_experiment</text>
    </g>

    <!-- Card 2.2 -->
    <g transform="translate(426, 32)" filter="url(#shadow)">
      <rect width="398" height="44" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="12" y="12" width="20" height="20" rx="4" fill="#64748b" fill-opacity="0.2"/>
      <text x="17" y="26" font-family="monospace" font-size="12" fill="#94a3b8">💬</text>
      <text x="42" y="20" class="card-title">Research Mode (Inquiry &amp; Design)</text>
      <text x="42" y="33" class="card-desc">Pure Conversation · Literature Review · Safety Invariant Q&amp;A</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <path d="M 235 293 L 235 315 M 635 293 L 635 315" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- LAYER 3: Protocol Simulation & Safety Gate -->
  <g transform="translate(40, 315)">
    <rect width="840" height="88" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="layer-title" fill="#10b981">3. Opentrons Simulation &amp; Safety Gate</text>

    <!-- Card 3.1 -->
    <g transform="translate(16, 32)" filter="url(#shadow)">
      <rect width="398" height="44" rx="8" fill="url(#cardGrad)" stroke="#065f46" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="6" fill="#10b981"/>
      <text x="36" y="20" class="card-title">Local CLI Analyzer (No-Robot Engine)</text>
      <text x="36" y="33" class="card-desc">opentrons.cli analyze --check --json-output · Volume &amp; Deck Verification</text>
    </g>

    <!-- Card 3.2 -->
    <g transform="translate(426, 32)" filter="url(#shadow)">
      <rect width="398" height="44" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="22" r="6" fill="#f59e0b"/>
      <text x="36" y="20" class="card-title">Deterministic Safety Isolation</text>
      <text x="36" y="33" class="card-desc">Zero Unconfirmed Physical Run · Liquid Bounds · Collision Proof</text>
    </g>
  </g>

  <!-- Connectors Layer 3 -> Layer 4 -->
  <path d="M 460 403 L 460 425" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- LAYER 4: MuJoCo Physics & 3D Web Preview -->
  <g transform="translate(40, 425)">
    <rect width="840" height="88" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="layer-title" fill="#f59e0b">4. MuJoCo Physics &amp; Flex 3D Visualization</text>

    <!-- Card 4.1 -->
    <g transform="translate(16, 32)" filter="url(#shadow)">
      <rect width="398" height="44" rx="8" fill="url(#cardGrad)" stroke="#78350f" stroke-width="1.2"/>
      <rect x="12" y="14" width="16" height="16" rx="3" fill="#f59e0b" fill-opacity="0.3"/>
      <path d="M15 22 l4 4 l7 -8" stroke="#fbbf24" stroke-width="1.8" fill="none"/>
      <text x="38" y="20" class="card-title">MuJoCo Kinematic &amp; Keyframe Generator</text>
      <text x="38" y="33" class="card-desc">flex3d/sim · Deck Meshes · Pipette Trajectory Interpolation</text>
    </g>

    <!-- Card 4.2 -->
    <g transform="translate(426, 32)" filter="url(#shadow)">
      <rect width="398" height="44" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="14" width="16" height="16" rx="3" fill="#38bdf8" fill-opacity="0.3"/>
      <path d="M15 22 l4 4 l7 -8" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <text x="38" y="20" class="card-title">Three.js Sandboxed 3D Viewer</text>
      <text x="38" y="33" class="card-desc">Opaque-Origin Iframe · Step Navigation · Smooth Orbit Controls</text>
    </g>
  </g>
</svg>

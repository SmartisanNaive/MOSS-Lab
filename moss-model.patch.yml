- insert:
    - id: moss-install-readiness
      name: ./internal/experiment/install-readiness.mjs
      disabled: !!js "process.env.MOSS_PACKAGED !== '1'"
    - id: experiment-store
      name: ./internal/experiment/plugin.mjs
      config:
        path: !!js process.env.MOSS_EXPERIMENT_DB
        create: false
    - id: labscriptai-runtime
      name: ./internal/experiment/runtime-plugin.mjs
      config:
        root: !!js process.env.MOSS_PLUGIN_ROOT
        data: !!js process.env.MOSS_PLUGIN_DATA
        state: !!js process.env.MOSS_PLUGIN_STATE
        dependencyHome: !!js process.env.LABSCRIPTAI_HOME
        visionPython: !!js process.env.MOSS_VISION_PYTHON
        version: !!js process.env.MOSS_PLUGIN_VERSION
        timeoutMs: 300000
    - id: experiment-preview
      name: ./internal/experiment/preview-plugin.mjs
      config:
        temporaryRoot: !!js process.env.MOSS_PREVIEW_TMP
    - id: robot-status
      name: ./internal/experiment/robot-status-plugin.mjs
      config:
        timeoutMs: 6000
        maxBytes: 262144
    - id: robot-control
      name: ./internal/experiment/robot-control-plugin.mjs
      config:
        url: !!js "process.env.OPENTRONS_URL ?? ''"
        allowLive: !!js "process.env.MOSS_ALLOW_LIVE_ROBOT === '1'"
    - id: protocol-analyzer
      name: ./internal/experiment/analyzer-plugin.mjs
    - id: experiment-workflow
      name: ./internal/experiment/workflow-plugin.mjs
    - id: experiment-agent-tools
      name: ./internal/experiment/agent-tools.mjs
    - id: experiment-demo
      name: ./internal/experiment/demo-plugin.mjs
      config:
        temporaryRoot: !!js process.env.MOSS_DEMO_TMP
    - id: xiaozhi-readonly
      name: ./internal/xiaozhi/plugin.mjs
      config:
        sessionId: null
        agentPreset: moss-experiment
        bindingPath: !!js "process.env.DSH_HOME + '/xiaozhi-session.json'"
        workspacePath: !!js process.cwd()
        diagnosticsPath: !!js "process.env.DSH_HOME + '/xiaozhi-diagnostics.jsonl'"
        feedback:
          offsetsMs: [0, 15000, 45000]
          pollWaitMs: 4000
          settleMs: 0
        transport:
          reconnectMinMs: 1000
          reconnectMaxMs: 30000
          connectTimeoutMs: 10000
          heartbeatMs: 20000
        wakeup:
          enabled: !!js "process.env.MOSS_AUTO_WAKE === '1'"
          browserApp: !!js "process.env.MOSS_BROWSER_APP || 'Google Chrome'"
          timeoutMs: 10000
- insert:
    - id: preset-moss-experiment
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: moss-experiment
        name: 实验助手
        description: 实验方案、三维预览和机器人运行
        order: 4
        plugins:
          - id: labscriptai-tools
            name: './internal/experiment/labscriptai-tools.mjs'
            config:
              prefix: >-
                You are the laboratory experiment assistant. Respond briefly in the user's language.
                A message prefixed 来自小智的委派 arrived here from the voice device: answer with one to three short spoken sentences, never tables, long lists or large code blocks; make the first sentence a self-contained conclusion of at most 30 characters and put details after it; answer a simple echo or connectivity test directly without tools; when a question is needed, call request_experiment_input with one short grouped question plus voice_question naming only the missing facts in at most 30 characters.
                In voice tasks prefer the workbench experiment tools (create/update/analyze/get_experiment, request_experiment_input, get_robot_status) and add the extra LabscriptAI checks only when the task truly needs them, so the turn ends quickly.
                For a simple echo or connectivity test, respond directly.
                While preparing, accept amendments. Preserve confirmed conditions and the same experiment ID.
                When essential conditions are missing, call request_experiment_input with one grouped question and wait.
                Read the selected robot's LabscriptAI authoring context before choosing equipment or slots.
                For a follow-up, read the current experiment revision, update it, and analyze the new revision.
                Create a new experiment only on explicit request or when the session has no experiment yet.
                Save each draft with the MOSS experiment tools. Analyze its current revision with analyze_experiment for the workbench preview.
                In LabscriptAI file_path and protocol_path arguments, current_protocol.py refers to the saved experiment in this conversation.
                Follow the LabscriptAI workflow and read_labscriptai_guidance. Use its tools for device status, on-demand photos, local deck vision, additional checks, and recovery.
                Only an explicit request for physical operation may trigger the workbench device confirmation. An ambiguous reply is insufficient.
                To run the saved, analyzed revision, call mcp__labscriptai__run_protocol with file_path current_protocol.py. The workbench confirmation covers supported minor automatic recovery on that run.
                Watch that run with mcp__labscriptai__runtime_watch after start is acknowledged. Read get_robot_run when the watch finishes to confirm the recorded outcome. Use query_history or get_robot_run for read-only status. After a disconnect use safe_next_action and check the original run before acting.
                Capture images and run deck vision on request or when LabscriptAI identifies a layout question. Report only checks that ran and observations actually returned.
                Do not inspect or modify application code or run shell commands.
          - id: robot-tools
            name: './internal/experiment/robot-tools.mjs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful conversational assistant. Answer directly without using tools.
              complete: true
              includeRuntimeContext: false
          - id: chat-tools
            name: './internal/chat-tools.mjs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
- id: agent-preset-registry
  config:
    default: moss-experiment
- id: llm-pi-ai
  config:
    providers:
      lab-gateway:
        displayName: LabScriptAI
        apiKeyEnv: AI_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.AI_API_URL.substring(0, process.env.AI_API_URL.lastIndexOf('/chat/completions'))"
        models:
          - id: !!js process.env.AI_MODEL
- id: agent-default-model
  config:
    provider: lab-gateway
    model: !!js process.env.AI_MODEL

name: MOSS web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Only test this retained Windows wheel without a checkout
        type: string
      public_version:
        description: Only test this published moss-v Windows package and its updater
        type: string

permissions:
  contents: read

concurrency:
  group: moss-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  standalone-install:
    if: github.event_name == 'workflow_dispatch' && (inputs.artifact_run_id != '' || inputs.public_version != '')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/moss-standalone.yml
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      public_version: ${{ inputs.public_version }}

  web:
    if: github.event_name != 'workflow_dispatch' || (inputs.artifact_run_id == '' && inputs.public_version == '')
    name: Build and test web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux confinement toolchain
        run: |
          stat -Lc '%a %U %G %n' /etc/resolv.conf
          for account in runner _apt; do
            if sudo -u "$account" timeout 15 getent ahostsv4 archive.ubuntu.com; then
              printf 'Ubuntu DNS resolves for %s\n' "$account"
            else
              printf 'Ubuntu DNS lookup failed for %s\n' "$account"
            fi
          done
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -q -o APT::Update::Error-Mode=any -o Acquire::Retries=0
          sudo apt-get install -yq musl-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web and check types
        run: pnpm run build
      - name: Test approval policy
        run: node --test .github/review-ownership/check-approval.test.mjs
      - name: Test experiment storage and preview resources
        run: node --import tsx/esm --test internal/experiment/tests/workflow.test.mjs internal/experiment/tests/agent-tools.test.mjs internal/experiment/tests/preview-resources.test.mjs internal/experiment/tests/robot-status-plugin.test.mjs internal/experiment/tests/robot-control.test.mjs internal/xiaozhi/*.test.mjs
      - name: Test plugin lock, recovery and download resources
        run: node --import tsx/esm --test internal/experiment/tests/plugin-runtime.test.mjs internal/experiment/tests/preview-recovery.test.mjs internal/experiment/tests/install-readiness.test.mjs
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: labscriptai-ot.lock.json
      - name: Build the Linux confinement launcher
        run: pnpm --dir native/system run build:native
      - name: Check the pinned plugin through public MCP
        run: node --import tsx/esm scripts/check-labscriptai.mjs
      - name: Test robot commands through pinned MCP and a loopback robot
        run: node --import tsx/esm --test internal/experiment/tests/robot-mcp-integration.test.mjs
      - name: Test client and workflow integration
        run: >-
          pnpm exec vitest run
          packages/client/ui-sidebar-experiment/tests/bundle.client.spec.ts
          packages/client/ui-sidebar-experiment/tests/experiment.client.spec.tsx
          packages/client/ui-sidebar-experiment/tests/voice-workbench.client.spec.tsx
          packages/client/ui-agent-preset/tests/settings-store.client.spec.ts
          packages/test-support/client-runtime/tests/assembly-test-client.client.spec.ts
          scripts/build-exe-for-python-sdk-office.spec.ts
      - name: Install Chromium for browser verification
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Test built web boot and voice continuation
        env:
          MOSS_TEST_REAL_OT: '1'
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/built-boot.expected.e2e.ts apps/web/tests/voice-workbench.e2e.ts

  windows-installer:
    if: github.event_name != 'workflow_dispatch' || (inputs.artifact_run_id == '' && inputs.public_version == '')
    name: Native Windows install and recovery
    runs-on: windows-2025
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      MOSS_ALLOW_LIVE_ROBOT: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enable native symlinks
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          git config --global core.symlinks true
      - name: Test native files, SQLite, failed upgrades and process-tree death
        run: |
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 0 /f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s python/moss-lab/tests -v
          $testExit = $LASTEXITCODE
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 1 /f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($testExit) { exit $testExit }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: labscriptai-ot.lock.json
      - name: Verify confined Flex and OT-2 simulation and portable documents
        run: node --import tsx/esm scripts/check-labscriptai.mjs
      - name: Verify confined robot controls against loopback fixtures only
        run: node --import tsx/esm --test internal/experiment/tests/robot-mcp-integration.test.mjs
      - name: Build application
        run: pnpm run build
      - name: Build complete Windows wheel
        id: build-wheel
        run: node --import tsx/esm scripts/build-moss-wheel.mjs --python python
      - name: Install wheel into a clean Python environment
        run: |
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 0 /f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $venv = Join-Path $env:RUNNER_TEMP 'MOSS 安装 spaces\venv'
          python -m venv $venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          $wheel = (Get-ChildItem dist-moss/moss_lab-*-win_amd64.whl).FullName
          & $python -m pip install --no-deps $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MOSS_TEST_PYTHON=$python" >> $env:GITHUB_ENV
          "MOSS_TEST_HOME=$(Join-Path $env:RUNNER_TEMP 'MOSS 数据 spaces\home')" >> $env:GITHUB_ENV
          "MOSS_TEST_OPENSSL=C:\Program Files\Git\usr\bin\openssl.exe" >> $env:GITHUB_ENV
      - name: Install real Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium
      - name: Test installed browser, real model, Flex and OT-2 simulation and downloads
        env:
          MOSS_INSTALL_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: node scripts/check-moss-installed.mjs "$env:MOSS_TEST_PYTHON" "$env:MOSS_TEST_HOME" validation-windows
      - name: Test real pip update, rollback, damaged-package repair and old-data migration
        run: '& $env:MOSS_TEST_PYTHON scripts/check-moss-pip.py "$env:MOSS_TEST_HOME" validation-windows'
      - name: Retain built candidate wheel and checksum
        if: always() && steps.build-wheel.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: moss-windows-wheel
          path: dist-moss/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain public test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moss-windows-test-evidence
          path: validation-windows/
          if-no-files-found: ignore
          retention-days: 14

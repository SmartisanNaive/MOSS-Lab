name: MOSS standalone Windows install

on:
  workflow_call:
    inputs:
      artifact_run_id:
        description: Successful MOSS web run containing the exact Windows wheel
        type: string
      public_version:
        description: Published moss-v version to install and update instead of an artifact
        type: string

permissions:
  contents: read
  actions: read

jobs:
  standalone:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      MOSS_ALLOW_LIVE_ROBOT: '0'
      DSH_TELEMETRY_DISABLED: '1'
      MOSS_ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
      MOSS_PUBLIC_VERSION: ${{ inputs.public_version }}
    steps:
      - name: Validate the selected package
        run: |
          $artifact = $env:MOSS_ARTIFACT_RUN
          $version = $env:MOSS_PUBLIC_VERSION
          if (($artifact -eq '') -eq ($version -eq '')) { throw 'Select exactly one artifact run or public version' }
          if ($artifact -and $artifact -notmatch '^\d+$') { throw 'Invalid artifact run ID' }
          if ($version -and $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid public version' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        if: inputs.artifact_run_id != ''
        with:
          name: moss-windows-wheel
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wheel
      - name: Install without a source checkout
        run: |
          if ((Get-ChildItem -Force $env:GITHUB_WORKSPACE | Measure-Object).Count) { throw 'Source workspace must be empty' }
          $venv = Join-Path $env:RUNNER_TEMP '独立安装 spaces\venv'
          python -m venv $venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          if ($env:MOSS_PUBLIC_VERSION) {
            $version = $env:MOSS_PUBLIC_VERSION
            $wheel = "https://github.com/SmartisanNaive/MOSS-Lab/releases/download/moss-v$version/moss_lab-$version-py3-none-win_amd64.whl"
          } else {
            $wheel = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wheel\moss_lab-*-win_amd64.whl')).FullName
          }
          & $python -m pip install --no-deps $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MOSS_STANDALONE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Start using only the bundled Node and uv
        run: |
          $python = $env:MOSS_STANDALONE_PYTHON
          $env:PATH = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0;$env:SystemRoot\System32\OpenSSH"
          Remove-Item Env:NODE_PATH,Env:PYTHONPATH,Env:PNPM_HOME -ErrorAction SilentlyContinue
          if (Get-Command node,uv,npm,pnpm,git -ErrorAction SilentlyContinue) { throw 'External developer tools must be absent from PATH' }
          $env:MOSS_HOME = Join-Path $env:RUNNER_TEMP '独立数据 spaces\home'
          New-Item -ItemType Directory -Path $env:MOSS_HOME -Force | Out-Null
          @'
          AI_API_URL="https://example.invalid/chat/completions"
          AI_MODEL="standalone-startup-only"
          AI_API_KEY="non-secret-startup-placeholder"
          XIAOZHI_WSS_URL=""
          OPENTRONS_URL=""
          MOSS_ALLOW_LIVE_ROBOT="0"
          '@ | Set-Content (Join-Path $env:MOSS_HOME '.env') -Encoding utf8NoBOM
          & $python -m moss_lab check --port 0 --timeout 1800
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:MOSS_PUBLIC_VERSION) {
            & $python -m moss_lab update --port 0 --timeout 1800
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $python -m moss_lab status
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = @{ platform = 'win32'; sourceCheckout = $false; externalNode = $false; externalUv = $false; artifactRun = $env:MOSS_ARTIFACT_RUN; publicVersion = $env:MOSS_PUBLIC_VERSION; status = 'PASS' }
          $result | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'moss-standalone.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: moss-standalone-evidence
          path: ${{ runner.temp }}/moss-standalone.json
          if-no-files-found: error
          retention-days: 14

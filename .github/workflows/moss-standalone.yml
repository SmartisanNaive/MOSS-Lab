name: MOSS standalone Windows install

on:
  workflow_call:
    inputs:
      artifact_run_id:
        description: Successful MOSS web run containing the exact Windows wheel
        type: string
      public_version:
        description: Published moss-v version to install and update instead of an artifact
        type: string

permissions:
  contents: read
  actions: read

jobs:
  standalone:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      MOSS_ALLOW_LIVE_ROBOT: '0'
      DSH_TELEMETRY_DISABLED: '1'
      MOSS_ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
      MOSS_PUBLIC_VERSION: ${{ inputs.public_version }}
    steps:
      - name: Validate the selected package
        run: |
          $artifact = $env:MOSS_ARTIFACT_RUN
          $version = $env:MOSS_PUBLIC_VERSION
          if (($artifact -eq '') -eq ($version -eq '')) { throw 'Select exactly one artifact run or public version' }
          if ($artifact -and $artifact -notmatch '^\d+$') { throw 'Invalid artifact run ID' }
          if ($version -and $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid public version' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        if: inputs.artifact_run_id != ''
        with:
          name: moss-windows-wheel
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wheel
      - name: Install without a source checkout
        run: |
          if ((Get-ChildItem -Force $env:GITHUB_WORKSPACE | Measure-Object).Count) { throw 'Source workspace must be empty' }
          $venv = Join-Path $env:RUNNER_TEMP '独立安装 spaces\venv'
          python -m venv $venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          if ($env:MOSS_PUBLIC_VERSION) {
            $version = $env:MOSS_PUBLIC_VERSION
            $wheel = "https://github.com/SmartisanNaive/MOSS-Lab/releases/download/moss-v$version/moss_lab-$version-py3-none-win_amd64.whl"
          } else {
            $wheel = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wheel\moss_lab-*-win_amd64.whl')).FullName
          }
          & $python -m pip install --no-deps $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MOSS_STANDALONE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Start using only the bundled Node and uv
        run: |
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 0 /f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = $env:MOSS_STANDALONE_PYTHON
          $env:PATH = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0;$env:SystemRoot\System32\OpenSSH"
          Remove-Item Env:NODE_PATH,Env:PYTHONPATH,Env:PNPM_HOME -ErrorAction SilentlyContinue
          if (Get-Command node,uv,npm,pnpm,git -ErrorAction SilentlyContinue) { throw 'External developer tools must be absent from PATH' }
          $env:MOSS_HOME = Join-Path $env:RUNNER_TEMP '独立数据 spaces\home'
          New-Item -ItemType Directory -Path $env:MOSS_HOME -Force | Out-Null
          @'
          AI_API_URL="https://example.invalid/chat/completions"
          AI_MODEL="standalone-startup-only"
          AI_API_KEY="non-secret-startup-placeholder"
          XIAOZHI_WSS_URL=""
          OPENTRONS_URL=""
          MOSS_ALLOW_LIVE_ROBOT="0"
          '@ | Set-Content (Join-Path $env:MOSS_HOME '.env') -Encoding utf8NoBOM
          @'
          import http.cookiejar, json, os, pathlib, queue, re, subprocess, sys, threading, time, urllib.parse, urllib.request
          child = subprocess.Popen([sys.executable, '-m', 'moss_lab', 'start', '--no-open', '--port', '0', '--timeout', '1800'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8')
          lines = queue.Queue()
          def read_output():
              for line in child.stdout:
                  lines.put(line)
              lines.put(None)
          reader = threading.Thread(target=read_output, daemon=True)
          reader.start()
          try:
              deadline = time.monotonic() + 1900
              url = None
              while time.monotonic() < deadline:
                  try: line = lines.get(timeout=1)
                  except queue.Empty: continue
                  if line is None: raise RuntimeError('Standalone application exited before readiness')
                  match = re.search(r'MOSS [\d.]+ ready\. (http[^\s]+)', line)
                  if match:
                      url = match[1]
                      break
              if url is None: raise RuntimeError('Standalone startup timed out')
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
              with opener.open(url, timeout=30) as response:
                  assert b'<html' in response.read().lower()
              origin = urllib.parse.urlsplit(url)
              def get(parameters):
                  address = urllib.parse.urlunsplit((origin.scheme, origin.netloc, '/api/experiment-demo', urllib.parse.urlencode(parameters), ''))
                  with opener.open(address, timeout=300) as response: return response.read()
              status = json.loads(get({'resource': 'status'}))
              assert status['status'] == 'ready', status
              common = {key: status[key] for key in ['id', 'revision', 'task']}
              common['session'] = 'demo'
              for name in ['animation', 'setup']:
                  content = get({**common, 'resource': name})
                  assert len(content) > 200 and re.search(br'<!doctype\s+html\b|<html\b', content, re.I), f'{name} must be an HTML document'
              names = {file['name'] for file in status['files']}
              assert {'setup.png', 'setup.json', 'wells.csv'} <= names
              for name in ['setup.png', 'setup.json', 'wells.csv']:
                  content = get({**common, 'resource': 'file', 'file': name})
                  assert len(content) > 20
                  if name.endswith('.png'): assert content.startswith(b'\x89PNG\r\n\x1a\n')
                  if name.endswith('.json'): assert json.loads(content)['state'] == 'declared_initial'
              pathlib.Path(os.environ['RUNNER_TEMP'], 'moss-demo.json').write_text(json.dumps({'simulation': 'PASS', 'documents': ['animation', 'setup'], 'files': sorted(names)}), encoding='utf-8')
          finally:
              if child.poll() is None: child.terminate()
              child.wait(timeout=15)
              reader.join(timeout=15)
              assert not reader.is_alive(), 'Standalone application descendants still hold the output pipe'
              child.stdout.close()
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'check-standalone.py') -Encoding utf8NoBOM
          & $python (Join-Path $env:RUNNER_TEMP 'check-standalone.py')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:MOSS_PUBLIC_VERSION) {
            & $python -m moss_lab update --port 0 --timeout 1800
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $python -m moss_lab status
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $demo = Get-Content (Join-Path $env:RUNNER_TEMP 'moss-demo.json') -Raw | ConvertFrom-Json
          $result = @{ platform = 'win32'; sourceCheckout = $false; externalNode = $false; externalUv = $false; longPathsEnabled = $false; demo = $demo; artifactRun = $env:MOSS_ARTIFACT_RUN; publicVersion = $env:MOSS_PUBLIC_VERSION; status = 'PASS' }
          $result | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'moss-standalone.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: moss-standalone-evidence
          path: ${{ runner.temp }}/moss-standalone.json
          if-no-files-found: error
          retention-days: 14
